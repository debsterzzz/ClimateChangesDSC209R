<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
  <title>Climate Indicators Map</title>

  <!-- MapLibre CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <!-- Your stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h2>Climate Indicators — Interactive World Map</h2>
  
  <div id="controls">
  <label for="yearSlider">Year: <span id="yearLabel">1992</span></label>
  <input id="yearSlider" type="range" min="1992" max="2010" step="1" value="1992">

  <!-- Play / Pause button -->
  <button id="playPause">Play</button>

  <button id="modeTemp">Temperature</button>
  <button id="modeSea">Sea Level</button>
  <button id="modeDisaster">Disasters</button>
  </div>

  <div id="map"></div>
  <div id="tooltip"></div>
  <div id="legend"></div>

  <!-- NEW: Global snapshot panel -->
  <div id="summaryPanel">
    <h3>Global snapshot for <span id="summary-year">1992</span></h3>
    <p class="summary-subtitle">
      A quick view of how the planet looked in the selected year.
    </p>

    <div class="summary-row">
      <div class="summary-label">Avg temperature anomaly</div>
      <div class="summary-value" id="summary-temp">–</div>
    </div>

    <div class="summary-row">
      <div class="summary-label">Avg sea level</div>
      <div class="summary-value" id="summary-sea">–</div>
    </div>

    <div class="summary-row">
      <div class="summary-label">Total climate disasters</div>
      <div class="summary-value" id="summary-disasters">–</div>
    </div>
  </div>

  <!-- MapLibre JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>

  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>

  <!-- Your Map Code -->
  <script src="map.js"></script>

</body>
</html>
